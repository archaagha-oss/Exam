events { worker_connections 1024; }

# Cycle 1.1b: HTTPS for every vhost. The previous config was HTTP-only across
# all four customer vhosts (audit P0-5), shipped HSTS without TLS to back it
# up, and had no superadmin / platform-admin vhost at all (audit P1-8).
#
# Cert paths assume Let's Encrypt's certbot renew layout under
# /etc/letsencrypt/live/<domain>/fullchain.pem (mounted into the nginx
# container at /etc/nginx/ssl/ via docker-compose). For dev / staging without
# real certs, generate a self-signed pair and bind-mount over those paths.

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on; tcp_nopush on; keepalive_timeout 65;
    gzip on; gzip_types text/plain text/css application/json application/javascript;

    server_tokens off;

    # ── Rate limiting zones ──────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api_ai:10m      rate=10r/m;
    # Stricter zone for the platform admin portal (vendor-only).
    limit_req_zone $binary_remote_addr zone=platform_admin:10m rate=5r/s;

    # ── Common security headers ──────────────────────────────
    # HSTS only takes effect once HTTPS is on. 31536000 = 1y; preload only
    # set after the domain is on the HSTS preload list.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── TLS defaults applied to every HTTPS server block ─────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    upstream api { server api:4000; keepalive 32; }

    # ── HTTP → HTTPS redirect (single shared block) ──────────
    # ACME challenge for Let's Encrypt renewal stays on plain HTTP; everything
    # else is redirected. server_name covers every customer subdomain plus
    # the vendor platform admin host.
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Student Portal (HTTPS) ───────────────────────────────
    server {
        listen 443 ssl http2;
        server_name exam.yourschool.edu;
        client_max_body_size 12m;

        ssl_certificate     /etc/nginx/ssl/exam.yourschool.edu/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/exam.yourschool.edu/privkey.pem;

        location = /api/v1/auth/login {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v1/ai/ {
            limit_req zone=api_ai burst=5 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass the bearer.<jwt> subprotocol through unchanged so the API
            # can authenticate the WS without a token in the URL.
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_read_timeout 86400s;
        }
        location / {
            root /var/www/student;
            index index.html;
            try_files $uri $uri/ /index.html;
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    # ── School Console (HTTPS) ───────────────────────────────
    # Cycle 2.0b / D6: replaces the separate teacher.yourschool.edu and
    # admin.yourschool.edu vhosts with a single role-aware SPA at
    # console.yourschool.edu. TEACHER and SCHOOL_ADMIN both land here; the
    # SPA Layout decides what nav items each role can see.
    server {
        listen 443 ssl http2;
        server_name console.yourschool.edu;
        client_max_body_size 12m;

        ssl_certificate     /etc/nginx/ssl/console.yourschool.edu/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/console.yourschool.edu/privkey.pem;

        location = /api/v1/auth/login {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v1/ai/ {
            limit_req zone=api_ai burst=5 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_read_timeout 86400s;
        }
        location / {
            root /var/www/console;
            index index.html;
            try_files $uri $uri/ /index.html;
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    # ── Platform Admin Portal (HTTPS, vendor-only) ───────────
    # Vendor-controlled subdomain (intentionally NOT under any customer's
    # *.yourschool.edu zone). Add an IP allowlist on the upstream reverse
    # proxy / VPN — this nginx block alone does not enforce one.
    server {
        listen 443 ssl http2;
        server_name platform.secureexam.app;
        client_max_body_size 8m;

        ssl_certificate     /etc/nginx/ssl/platform.secureexam.app/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/platform.secureexam.app/privkey.pem;

        location = /api/v1/auth/login {
            limit_req zone=platform_admin burst=2 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            limit_req zone=platform_admin burst=10 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            root /var/www/platform;
            index index.html;
            try_files $uri $uri/ /index.html;
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    # ── API subdomain (HTTPS) ────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.yourschool.edu;
        client_max_body_size 12m;

        ssl_certificate     /etc/nginx/ssl/api.yourschool.edu/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/api.yourschool.edu/privkey.pem;

        location = /api/v1/auth/login {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            limit_req zone=api_general burst=60 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_read_timeout 86400s;
        }
    }
}
