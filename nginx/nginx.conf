events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on; tcp_nopush on; keepalive_timeout 65;
    gzip on; gzip_types text/plain text/css application/json application/javascript;

    server_tokens off;

    # ── Rate limiting zones ──────────────────────────────────
    # Defence-in-depth on top of express-rate-limit. nginx applies before
    # the request even reaches Node, so it absorbs traffic spikes cheaply.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api_ai:10m      rate=10r/m;

    # Common security headers — duplicates what helmet sets but ensures
    # static-asset responses get them too.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    upstream api { server api:4000; keepalive 32; }

    # Student Portal
    server {
        listen 80;
        server_name exam.yourschool.edu;
        client_max_body_size 12m;

        location = /api/v1/auth/login {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/ai/ {
            limit_req zone=api_ai burst=5 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
        location / {
            root /var/www/student;
            index index.html;
            try_files $uri $uri/ /index.html;
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }

