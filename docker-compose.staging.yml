# docker-compose.staging.yml
#
# Staging mirror of docker-compose.prod.yml (cycle 1.4 / P1-11). Same shape
# as prod so behaviour parity is real; differences are intentional and
# narrow:
#   - DATABASE_URL / REDIS_URL / SMTP creds come from .env.staging, not the
#     prod secrets store
#   - nginx serves self-signed certs from ./nginx/dev-ssl (generated by
#     scripts/dev-certs.sh) — not real Let's Encrypt
#   - NODE_ENV=staging so Sentry environment tagging separates the streams
#   - the migrate profile is on by default so each `up` applies pending
#     migrations (safer for staging; explicit on prod)
#
# Run:
#   ./scripts/dev-certs.sh                         # one-time
#   cp .env.production.example .env.staging        # then edit
#   docker compose -f docker-compose.staging.yml up -d --build
#
version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secureexam_staging}
      POSTGRES_USER: ${POSTGRES_USER:-secureexam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U secureexam']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata_staging:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secureexam_staging}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@staging.secureexam.app}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-staging}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
      - external

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/dev-ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
      - student_build_staging:/var/www/student:ro
      - console_build_staging:/var/www/console:ro
      - platform_build_staging:/var/www/platform:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - external

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secureexam_staging}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata_staging:
  redisdata_staging:
  student_build_staging:
  console_build_staging:
  platform_build_staging:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
