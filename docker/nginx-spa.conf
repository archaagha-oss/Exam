# docker/nginx-spa.conf
# Used inside the student and teacher Docker containers
# Handles React Router's client-side routing

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Cache static assets aggressively, bust via hashed filenames (Vite default)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — everything that isn't a file goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
