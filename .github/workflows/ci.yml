# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ─────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  # ── Type-check ───────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=packages/shared-types
      - run: npx tsc --noEmit --project apps/api/tsconfig.json

  # ── API tests ────────────────────────────────────────────
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: secureexam_test
          POSTGRES_USER: secureexam
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://secureexam:testpass@localhost:5432/secureexam_test
      JWT_SECRET: test-jwt-secret-32-chars-minimum-xx
      JWT_REFRESH_SECRET: test-refresh-secret-32-chars-minimum
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate
      - name: Run migrations
        run: cd apps/api && npx prisma migrate deploy
      - name: Seed minimal test data
        run: cd apps/api && npx ts-node prisma/seed.ts || true
      - name: Run tests
        run: npm test --workspace=apps/api

  # ── Build Docker images ──────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-api]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/secureexam-api:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/secureexam-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Student portal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.student
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/secureexam-student:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/secureexam-student:latest

      - name: Build and push School Console (was Teacher + Admin, merged in cycle 2.0b)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.console
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/secureexam-console:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/secureexam-console:latest

      - name: Build and push Platform Admin portal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.platform
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/secureexam-platform:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/secureexam-platform:latest

  # ── Deploy ───────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/secureexam
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --profile migrate up migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
